<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1440, initial-scale=1" />
  <title>Payflip · Pension savings · Testable prototype</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <style>
    :root {
      --color-primary: #d44a74;
      --color-primary-hover: #b83b62;
      --color-strong: #0f0d28;
      --color-text-prominent: #0f0d28;
      --color-text-default: #50545e;
      --color-text-muted: #8b8d96;
      --color-text-inverted: #ffffff;
      --color-surface: #f7f7f8;
      --color-surface-hover: #eaeaeb;
      --color-border-light: #eaeaeb;
      --color-border-mid: #d4d6db;
      --color-success-bg: #ebf9f1;
      --color-success-text: #086343;
      --color-warning-bg: #fff5e0;
      --color-warning-text: #92520c;
      --color-warning-border: #f4c77d;
      --color-info-bg: #eef2ff;
      --color-info-text: #1d3a8a;
      --color-brand-bg: #fdf5f8;
      --color-brand-bg-deep: #fbe7ee;
      --color-brand-text: #b83b62;
      --shadow-card: 0 10px 15px -3px rgba(0, 0, 0, 0.06), 0 4px 6px -4px rgba(0, 0, 0, 0.06);
      --shadow-modal: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }
    html, body {
      font-family: 'Studio Feixen Sans', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: var(--color-text-prominent);
      letter-spacing: -0.005em;
    }
    .ff-display { font-family: 'Studio Feixen Sans', 'Plus Jakarta Sans', system-ui, sans-serif; }
    .ff-poppins { font-family: 'Poppins', system-ui, sans-serif; }
    .focus-ring:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
    .link-underline { text-underline-offset: 3px; }
    /* Custom scrollbar for modal */
    .nice-scroll::-webkit-scrollbar { width: 8px; }
    .nice-scroll::-webkit-scrollbar-thumb { background: #d4d6db; border-radius: 4px; }
    /* Dialog backdrop fade */
    @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
    @keyframes scaleIn { from { opacity: 0; transform: scale(0.96) translateY(4px) } to { opacity: 1; transform: scale(1) translateY(0) } }
    .anim-fade { animation: fadeIn 180ms ease-out both; }
    .anim-scale { animation: scaleIn 220ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Page-level step transitions */
    @keyframes pageEnterForward {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pageEnterBackward {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-page-forward { animation: pageEnterForward 280ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .anim-page-back { animation: pageEnterBackward 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Stagger helpers for content blocks within a page */
    .stagger > * { opacity: 0; animation: pageEnterForward 360ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .stagger > *:nth-child(1) { animation-delay: 60ms; }
    .stagger > *:nth-child(2) { animation-delay: 120ms; }
    .stagger > *:nth-child(3) { animation-delay: 180ms; }
    .stagger > *:nth-child(4) { animation-delay: 240ms; }
    .stagger > *:nth-child(5) { animation-delay: 300ms; }

    /* Success checkmark pop + ring */
    @keyframes successPop {
      0% { opacity: 0; transform: scale(0.4); }
      55% { transform: scale(1.15); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes successRing {
      0% { transform: scale(0.8); opacity: 0.55; }
      100% { transform: scale(1.7); opacity: 0; }
    }
    @keyframes drawCheck {
      0% { stroke-dashoffset: 30; opacity: 0; }
      30% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }
    .anim-success-pop { animation: successPop 420ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .anim-success-ring {
      animation: successRing 1.4s cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 220ms;
    }
    .anim-draw-check {
      stroke-dasharray: 30;
      stroke-dashoffset: 30;
      animation: drawCheck 500ms cubic-bezier(0.16, 1, 0.3, 1) both;
      animation-delay: 280ms;
    }

    /* Reveal animations for inline UI changes */
    @keyframes slideReveal {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .anim-reveal { animation: slideReveal 260ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Stepper label crossfade — direction-aware to match page transition */
    @keyframes labelSlideFwd {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes labelSlideBack {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .anim-label-slide-fwd { animation: labelSlideFwd 280ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .anim-label-slide-back { animation: labelSlideBack 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }

    /* Button press */
    button:active:not(:disabled) { transform: translateY(0.5px); }

    /* =========================================================================
       Mobile mode — activates when wrapper has .mobile-mode class
       Mobile-first patterns from Figma: sticky bottom CTA, stacked at-a-glance,
       no side panels (action surfaces move to sticky bottom).
       ========================================================================= */
    .mobile-mode .max-w-\[1248px\] { max-width: 100% !important; }
    .mobile-mode .max-w-\[760px\]  { max-width: 100% !important; }
    .mobile-mode .max-w-\[600px\]  { max-width: 100% !important; }
    .mobile-mode .max-w-\[640px\]  { max-width: 100% !important; }
    .mobile-mode .max-w-\[440px\]  { max-width: 100% !important; }
    /* Tighter horizontal padding to match the 20px mobile design */
    .mobile-mode .px-6 { padding-left: 20px !important; padding-right: 20px !important; }
    .mobile-mode .px-8 { padding-left: 20px !important; padding-right: 20px !important; }
    /* Zero inner-section padding only for intro/benefit-detail content sections (direct children of main).
       Cards and other px-5 elements deeper in the tree keep their padding. */
    .mobile-mode .flow-row > main > .px-5 {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    /* Hide desktop side panels — actions surface in sticky bottoms instead */
    .mobile-mode aside {
      display: none !important;
    }
    /* Stack flex layouts (just in case any aside slips through) */
    .mobile-mode .flow-row {
      flex-direction: column !important;
      gap: 0 !important;
    }
    /* At-a-glance: 3-col grid → stacked rows with separators */
    .mobile-mode .glance-grid {
      grid-template-columns: 1fr !important;
      gap: 0 !important;
    }
    .mobile-mode .glance-grid > button {
      flex-direction: row !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 12px !important;
      border-radius: 0 !important;
      background: transparent !important;
      border: none !important;
      border-bottom: 1px solid var(--color-border-light) !important;
      padding: 16px 0 !important;
    }
    .mobile-mode .glance-grid > button:last-child {
      border-bottom: none !important;
    }
    .mobile-mode .glance-grid > button > div:first-child {
      flex: none !important;
    }
    .mobile-mode .glance-grid > button > div:last-child {
      gap: 8px !important;
    }
    /* Mobile bottom action bar — pinned at bottom by flex layout */
    .mobile-bottom-bar {
      display: none;
    }
    .mobile-mode .mobile-bottom-bar {
      display: block;
      flex-shrink: 0;
      background: white;
      padding: 12px 20px 16px;
      border-top: 1px solid var(--color-border-light);
      box-shadow: 0 -4px 12px -2px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }
    /* Hide desktop-only inline FlowActions on mobile (we render sticky bottom instead) */
    .mobile-mode .flow-actions-desktop {
      display: none !important;
    }
    /* Hide mobile-only blocks on desktop */
    .mobile-only { display: none; }
    .mobile-mode .mobile-only { display: block; }
    .mobile-mode .desktop-only { display: none !important; }
    /* Stack the "How it works" 2-col grid on mobile */
    .mobile-mode .howto-grid { grid-template-columns: 1fr !important; }

    /* Full-bleed progress bar on mobile — shell zeros its horizontal padding,
       label gets its own 20px padding, bar fills container edge to edge */
    .mobile-mode .stepper-shell {
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    .mobile-mode .stepper-shell p {
      padding-left: 20px !important;
      padding-right: 20px !important;
    }
    .mobile-mode .stepper-bar,
    .mobile-mode .stepper-fill {
      border-radius: 0 !important;
    }

    /* =========================================================================
       Bottom drawer modal — mobile mode anchors modals to the bottom of phone
       ========================================================================= */
    .mobile-mode .modal-overlay {
      align-items: flex-end !important;
      padding: 0 !important;
    }
    .mobile-mode .modal-card {
      border-radius: 16px 16px 0 0 !important;
      width: 100% !important;
      max-width: 100% !important;
      max-height: 85% !important;
      margin: 0 !important;
      animation: drawerUp 320ms cubic-bezier(0.16, 1, 0.3, 1) both !important;
    }
    /* Subtle handle indicator at top of mobile drawers for affordance */
    .mobile-mode .modal-card::before {
      content: '';
      display: block;
      width: 36px;
      height: 4px;
      border-radius: 2px;
      background: var(--color-border-mid);
      margin: 8px auto 0;
      flex-shrink: 0;
    }
    @keyframes drawerUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Phone-frame chrome */
    .device-bezel {
      background: #1f2937;
      padding: 8px;
      border-radius: 36px;
      box-shadow: 0 12px 40px rgba(15, 13, 40, 0.18), 0 2px 8px rgba(15, 13, 40, 0.08);
    }
    .device-screen {
      background: white;
      border-radius: 28px;
      overflow: hidden;
      width: 390px;
      height: calc(100vh - 80px);
      /* transform creates a containing block for position:fixed children — keeps modals confined to phone frame */
      transform: translateZ(0);
      position: relative;
    }
    /* Mobile flex shell — header(s) at top, scroll area fills, bottom bar pinned */
    .mobile-mode {
      display: flex !important;
      flex-direction: column;
    }
    .mobile-scroll-area {
      flex: 1;
      min-height: 0;
    }
    .mobile-mode .mobile-scroll-area {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    /* Keyed page wrapper inside scroll area also fills (so screens can use min-height: 100%) */
    .mobile-mode .mobile-scroll-area > div {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .anim-page-forward, .anim-page-back, .anim-fade, .anim-scale,
      .anim-success-pop, .anim-success-ring, .anim-draw-check,
      .anim-reveal, .anim-label-slide-fwd, .anim-label-slide-back, .stagger > * {
        animation: none !important;
      }
      * { transition-duration: 0.01ms !important; }
    }
    /* File drop hover */
    .drop-zone-active { border-color: var(--color-primary) !important; background: #fdf5f8 !important; }
    /* Print clean (in case Pauline screenshots) */
    @media print { .moderator-panel { display: none !important; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useMemo, useRef } = React;

    /* =========================================================================
       Icons (inline SVG — keep stroke 1.5 to match Lucide-ish feel)
       ========================================================================= */
    const Icon = ({ d, size = 16, stroke = 1.5, fill = 'none', viewBox = '0 0 24 24', className = '' }) => (
      <svg
        width={size} height={size} viewBox={viewBox} fill={fill} stroke="currentColor"
        strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round"
        className={className} aria-hidden="true"
      >
        {d}
      </svg>
    );
    const ICONS = {
      cloudUpload: <><path d="M12 13v8" /><path d="m8 17 4-4 4 4" /><path d="M20 16.2A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25" /></>,
      check: <path d="M20 6 9 17l-5-5" />,
      checkCircle: <><circle cx="12" cy="12" r="10" /><path d="m9 12 2 2 4-4" /></>,
      x: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
      arrowLeft: <><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></>,
      arrowRight: <><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></>,
      info: <><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></>,
      alert: <><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" /><path d="M12 9v4" /><path d="M12 17h.01" /></>,
      file: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2Z" /><path d="M14 2v6h6" /></>,
      trendingUp: <><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></>,
      pencil: <><path d="M12 20h9" /><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5Z" /></>,
      chevron: <path d="m6 9 6 6 6-6" />,
      book: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></>,
      sparkle: <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1" />,
      lock: <><rect x="3" y="11" width="18" height="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
    };

    /* =========================================================================
       Top-level constants
       ========================================================================= */
    const CEILING = 1350;
    const TAX_ADVANTAGE_RATE = 0.30; // ~30% net advantage
    const EMPLOYER_COST = 0.0886;
    // Net on payslip multiplier — derived from the calc modal: cashOutRate (0.362) + advantageRate (0.16) = 0.522
    // Single source of truth so every surface ("Est. net on payslip", success/benefit screens, intro CTA, glance card) reconciles.
    const NET_PAYSLIP_RATE = 0.522;
    const netOnPayslip = (amount) => Math.round(amount * NET_PAYSLIP_RATE);
    const STEPS = ['intro', 'upload', 'verify', 'budget', 'review', 'success'];
    const STEPPER_LABELS = ['Upload', 'Verify amount', 'Choose budget'];
    const STEPPER_TOTAL = 3;

    /* =========================================================================
       Reusable primitives
       ========================================================================= */
    const Button = ({ variant = 'primary', size = 'md', children, disabled, onClick, className = '', leftIcon, rightIcon, type = 'button' }) => {
      const base = 'inline-flex items-center justify-center gap-2 rounded-[10px] font-semibold transition focus-ring whitespace-nowrap';
      const sizes = {
        sm: 'h-9 px-3 text-sm',
        md: 'h-10 px-4 text-[15px]',
        lg: 'h-11 px-5 text-base',
      };
      const variants = {
        primary: 'text-white shadow-sm',
        secondary: 'bg-white border border-[var(--color-border-mid)] text-[var(--color-text-prominent)] hover:bg-[var(--color-surface)]',
        ghost: 'bg-transparent text-[var(--color-text-prominent)] hover:bg-[var(--color-surface)]',
        link: 'h-auto p-0 underline text-[var(--color-text-prominent)] hover:opacity-70',
      };
      const style = variant === 'primary'
        ? { background: disabled ? '#e5b6c5' : 'var(--color-primary)' }
        : {};
      return (
        <button
          type={type}
          onClick={onClick}
          disabled={disabled}
          className={`${base} ${variants[variant]} ${variant === 'link' ? '' : sizes[size]} ${disabled ? 'cursor-not-allowed opacity-90' : 'cursor-pointer'} ${className}`}
          style={style}
        >
          {leftIcon}
          {children}
          {rightIcon}
        </button>
      );
    };

    const Pill = ({ children, tone = 'neutral' }) => {
      const tones = {
        neutral: 'bg-[var(--color-surface)] text-[var(--color-text-prominent)]',
        success: 'bg-[var(--color-success-bg)] text-[var(--color-success-text)]',
        warning: 'bg-[var(--color-warning-bg)] text-[var(--color-warning-text)]',
        brand: 'bg-[var(--color-brand-bg)] text-[var(--color-brand-text)]',
      };
      return (
        <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-md text-xs font-medium ${tones[tone]}`}>
          {children}
        </span>
      );
    };

    /* Mobile bottom action bar — pinned at bottom by flex layout */
    const MobileBottomBar = ({ children }) => (
      <div className="mobile-bottom-bar">{children}</div>
    );

    /* Lightweight 2-column bottom: info on left, action button on right.
       Pattern from the Figma "Sticky bottom" component. */
    const BottomBarSplit = ({ infoTop, infoMain, infoSub, helper, action }) => (
      <div className="flex items-center gap-6">
        <div className="flex-1 flex flex-col justify-center min-h-[48px] gap-0.5 min-w-0">
          {infoTop && (
            <div className="text-[11px] font-medium text-[var(--color-text-default)] tracking-[0.04em] uppercase">
              {infoTop}
            </div>
          )}
          {infoMain && (
            <div className="ff-display font-semibold text-xl leading-7 tracking-tight text-[var(--color-text-prominent)]">
              {infoMain}
            </div>
          )}
          {infoSub && (
            <div className="text-xs font-medium text-[var(--color-text-default)] leading-4">
              {infoSub}
            </div>
          )}
          {helper && !infoTop && !infoMain && (
            <div className="text-xs font-medium text-[var(--color-text-default)] leading-4">
              {helper}
            </div>
          )}
        </div>
        <div className="flex-1">{action}</div>
      </div>
    );

    /* Stacked bottom: helper text (full width), checkbox, full-width button.
       Pattern from the Figma Review screen. */
    const BottomBarStacked = ({ helper, checkbox, action }) => (
      <div className="flex flex-col gap-3">
        {helper && (
          <div className="text-xs font-medium text-[var(--color-text-default)] leading-4">
            {helper}
          </div>
        )}
        {checkbox}
        {action}
      </div>
    );

    /* Inline details panel — explains budget impact + advantage, shown when user
       expands the toggle from the bottom bar. Compact enough to live above the action row. */
    const BottomBarDetailsPanel = ({ amount }) => {
      const fmt = (n) => n.toLocaleString('en-BE');
      const employerCost = Math.round(amount * EMPLOYER_COST);
      const totalImpact = amount + employerCost;
      const advantage = Math.round(amount * 0.16);
      return (
        <div
          className="rounded-lg p-3 flex flex-col gap-3 text-sm anim-reveal"
          style={{ background: 'var(--color-surface)' }}
        >
          {/* Why is the budget impact higher? */}
          <div className="flex flex-col gap-1.5">
            <div className="flex items-center justify-between">
              <span className="text-sm font-semibold text-[var(--color-text-prominent)]">
                Why €{fmt(totalImpact)}?
              </span>
              <span className="text-sm font-semibold tabular-nums text-[var(--color-text-prominent)]">
                €{fmt(totalImpact)}
              </span>
            </div>
            <div className="flex flex-col gap-0.5 text-xs text-[var(--color-text-default)]">
              <div className="flex justify-between">
                <span>Your contribution</span>
                <span className="tabular-nums">€{fmt(amount)}</span>
              </div>
              <div className="flex justify-between">
                <span>Employer cost (8.86%)</span>
                <span className="tabular-nums">+€{fmt(employerCost)}</span>
              </div>
            </div>
          </div>
          <div style={{ height: 1, background: 'var(--color-border-mid)' }} />
          {/* Advantage explanation */}
          <div className="flex flex-col gap-1.5">
            <div className="flex items-center justify-between">
              <span className="text-sm font-semibold flex items-center gap-1.5" style={{ color: 'var(--color-brand-text)' }}>
                <Icon d={ICONS.trendingUp} size={14} />
                Net advantage
              </span>
              <span className="text-sm font-semibold tabular-nums" style={{ color: 'var(--color-brand-text)' }}>
                +€{fmt(advantage)}
              </span>
            </div>
            <p className="text-xs text-[var(--color-text-default)] leading-4">
              Pension savings is exempt from NSSO and earns a 30% tax credit, keeping you €{fmt(advantage)} more vs cash.
            </p>
          </div>
        </div>
      );
    };

    /* Chevron toggle button — used inside the bottom bar to open/close the details panel.
       Closed: chevron up (panel will open upward). Open: chevron down (panel will collapse downward). */
    const DetailsToggle = ({ open, onToggle }) => (
      <button
        onClick={onToggle}
        className="flex items-center gap-1 text-xs font-medium hover:opacity-70 transition"
        style={{ color: 'var(--color-text-default)' }}
      >
        {open ? 'Hide details' : 'Why this amount?'}
        <Icon
          d={ICONS.chevron}
          size={14}
          style={{
            transform: open ? 'rotate(0deg)' : 'rotate(180deg)',
            transition: 'transform 200ms',
          }}
        />
      </button>
    );

    /* Mobile breakdown row — used on Review and BenefitDetail to surface key numbers
       inline (since there's no side panel). Pattern matches the Figma mobile design:
       icon + label + "How is this calculated?" link, value on the right. */
    const MobileBreakdownRow = ({ icon, label, value, calcLink, calcView, onOpenCalc, brand }) => (
      <div
        className="rounded-xl px-3 py-3 flex items-center justify-between gap-3"
        style={{
          background: brand ? 'var(--color-brand-bg)' : 'var(--color-surface)',
          border: brand ? '1px solid var(--color-brand-bg-deep)' : '1px solid var(--color-border-light)',
        }}
      >
        <div className="flex flex-col gap-1 min-w-0">
          <div className="flex items-center gap-2">
            <Icon
              d={icon}
              size={16}
              style={{ color: brand ? 'var(--color-brand-text)' : 'var(--color-text-prominent)' }}
            />
            <span
              className="text-sm font-semibold"
              style={{ color: brand ? 'var(--color-brand-text)' : 'var(--color-text-prominent)' }}
            >
              {label}
            </span>
          </div>
          {calcLink && (

        if (!f) { setDraft(null); return; }
        setDraft({
          name: f.name || 'attest_281_60_2024.pdf',
          size: f.size ? `${(f.size / 1024).toFixed(2)} kb` : '92.23 kb',
        });
      };

      return (
        <Modal onClose={onClose} maxWidth={520}>

    const EditBudgetModal = ({ amount, primary, secondary, onSave, onClose }) => {
      const POTS = {

          </div>
          <div className="flex flex-col gap-1.5 text-sm">
            <div className="flex items-baseline justify-between">
              <span className="text-[var(--color-text-prominent)]">Up to <span className="font-semibold tabular-nums">€1,050</span></span>
              <span className="text-[var(--color-text-default)]">30% reduction (max €315)</span>
            </div>
            <div className="flex items-baseline justify-between">
              <span className="text-[var(--color-text-prominent)]">Up to <span className="font-semibold tabular-nums">€1,350</span></span>
              <span className="text-[var(--color-text-default)]">25% reduction (max €337.50)</span>
            </div>
          </div>
        </div>

        <p className="text-xs text-[var(--color-text-default)] leading-4 mt-3">
          Make sure to use the document labelled <span className="font-medium">281.60</span> — it's the specific one for pension savings.
        </p>
      </Modal>
    );

    /* =========================================================================
       Cancel claim confirmation dialog
       ========================================================================= */
    const CancelClaimDialog = ({ onConfirm, onClose }) => (
      <Modal onClose={onClose} maxWidth={420}>
        <div className="flex items-start justify-between mb-1">
          <h2 className="ff-display font-bold text-[22px] leading-7 tracking-tight">Cancel your choice?</h2>
          <button
            onClick={onClose}
            className="w-8 h-8 -mt-1 -mr-1 rounded-md flex items-center justify-center hover:bg-[var(--color-surface)] text-[var(--color-text-default)]"
            aria-label="Close"
          >
            <Icon d={ICONS.x} size={16} />
          </button>
        </div>
        <p className="text-sm text-[var(--color-text-default)] leading-5 mb-5">
          Your submission will be removed and your budget allocations released. You can submit a new choice anytime — your fiscal attest stays valid for this tax year.
        </p>
        <div className="flex gap-3 mt-6">
          <Button variant="secondary" className="flex-1" onClick={onClose}>Keep claim</Button>
          <Button variant="primary" className="flex-1" onClick={onConfirm}>Cancel choice</Button>
        </div>
      </Modal>
    );

    /* =========================================================================
       Generic Modal helper
       ========================================================================= */
    const Modal = ({ children, onClose, maxWidth = 480 }) => (
      <div className="modal-overlay fixed inset-0 z-40 flex items-center justify-center anim-fade">
        <div className="absolute inset-0 bg-black/40" onClick={onClose} />
        <div
          className="modal-card relative bg-white rounded-2xl anim-scale w-full mx-4 flex flex-col"
          style={{ boxShadow: 'var(--shadow-modal)', maxWidth }}
        >
          <div className="p-6 overflow-y-auto">{children}</div>
        </div>
      </div>
    );

    /* =========================================================================
       Flow frame (stepper + content + sidebar)
       ========================================================================= */
    const FlowFrame = ({ side, children }) => (
      <div className="max-w-[1248px] mx-auto px-6 pt-6 pb-4">
        <div className="flow-row flex gap-6">
          <main className="flex-1 max-w-[760px]">{children}</main>
          {side}
        </div>
      </div>
    );

    const FlowActions = ({ onBack, onNext, nextDisabled, nextLabel }) => (
      /* Desktop only — mobile uses App-level MobileBottomBar */
      <div className="flow-actions-desktop pt-4 pb-2 flex items-center gap-3">
        <Button variant="secondary" onClick={onBack} leftIcon={<Icon d={ICONS.arrowLeft} size={16} />}>Back</Button>
        <Button variant="primary" onClick={onNext} disabled={nextDisabled} rightIcon={<Icon d={ICONS.arrowRight} size={16} />}>
          {nextLabel}
        </Button>
      </div>
    );

    /* =========================================================================
       Moderator panel — for testing only
       ========================================================================= */
    const ModeratorPanel = ({ step, onJump, onReset, taskMode, onToggleTask, currentTask, device, onSetDevice }) => {
      const [open, setOpen] = useState(false);
      const screenLabels = ['1. Intro', '2. Upload', '3. Verify amount', '4. Choose budget', '5. Review', '6. Success', '7. My benefit'];
      return (
        <div className="moderator-panel fixed bottom-4 right-4 z-50 ff-poppins">
          {open && (
            <div
              className="bg-[var(--color-strong)] text-white rounded-xl p-4 mb-2 w-72 anim-fade"
              style={{ boxShadow: 'var(--shadow-modal)' }}
            >
              <div className="text-[11px] uppercase tracking-wider opacity-60 mb-3 font-semibold">Moderator panel</div>

              {/* Device toggle */}
              <div className="mb-4">
                <div className="text-[10px] uppercase tracking-wider opacity-50 mb-1.5 font-semibold">Device</div>
                <div className="flex gap-1 bg-white/10 rounded-md p-1">
                  <button
                    onClick={() => onSetDevice('desktop')}
                    className={`flex-1 px-2 py-1 rounded text-xs transition ${device === 'desktop' ? 'bg-white text-[var(--color-strong)] font-semibold' : 'hover:bg-white/10'}`}
                  >
                    Desktop
                  </button>
                  <button
                    onClick={() => onSetDevice('mobile')}
                    className={`flex-1 px-2 py-1 rounded text-xs transition ${device === 'mobile' ? 'bg-white text-[var(--color-strong)] font-semibold' : 'hover:bg-white/10'}`}
                  >
                    Mobile
                  </button>
                </div>
              </div>

              <div className="text-[10px] uppercase tracking-wider opacity-50 mb-1.5 font-semibold">Screen</div>
              <div className="flex flex-col gap-1.5 mb-4">
                {screenLabels.map((label, i) => (
                  <button
                    key={label}
                    onClick={() => onJump(i)}
                    className={`text-left px-3 py-1.5 rounded-md text-xs transition ${step === i ? 'bg-white/20 font-semibold' : 'hover:bg-white/10'}`}
                  >
                    {label}
                  </button>
                ))}
              </div>
              <div className="flex flex-col gap-2 pt-3 border-t border-white/10">
                <label className="flex items-center gap-2 cursor-pointer text-xs">
                  <input type="checkbox" checked={taskMode} onChange={onToggleTask} />
                  Show task to participant
                </label>
                <button
                  onClick={onReset}
                  className="text-left px-3 py-1.5 rounded-md text-xs bg-white/10 hover:bg-white/20 transition"
                >
                  ↺ Reset prototype
                </button>
              </div>
            </div>
          )}
          <button
            onClick={() => setOpen(!open)}
            className="bg-[var(--color-strong)] text-white rounded-full px-4 py-2.5 text-xs font-semibold hover:opacity-90 flex items-center gap-2"
            style={{ boxShadow: 'var(--shadow-modal)' }}
          >
            <Icon d={ICONS.sparkle} size={14} />
            {open ? 'Hide' : 'Moderator'}
          </button>
        </div>
      );
    };

    const TaskBanner = ({ task }) => task ? (
      <div
        className="sticky top-[60px] z-20 mx-auto max-w-[1248px] px-6 pt-3"
      >
        <div
          className="rounded-xl px-4 py-3 flex items-start gap-3 anim-fade"
          style={{
            background: '#fff8e6',
            border: '1px solid #f4c77d',
          }}
        >
          <Icon d={ICONS.sparkle} size={16} className="mt-0.5 shrink-0" style={{ color: 'var(--color-warning-text)' }} />
          <div className="text-sm leading-5" style={{ color: 'var(--color-warning-text)' }}>
            <span className="font-semibold">Task: </span>{task}
          </div>
        </div>
      </div>
    ) : null;

    /* =========================================================================
       App — main state machine
       ========================================================================= */
    const TASKS = {
      0: 'You\'ve just heard you can get back some of the money you\'ve been investing in pension savings. Take a look at this page and tell me out loud what you understand. (You can click "See full calculation" to see how the numbers work.)',
      1: 'You want to start. Upload your fiscal attest. (You\'ll find a sample PDF on the desktop — but feel free to drag any file.)',
      2: 'The amount has been read from your document. Tell me what you see and adjust if needed.',
      3: 'You want to fund this benefit. Pick the budget(s) you\'d like to use.',
      4: 'Take a final look. If everything checks out, submit your choice.',
      5: 'Tell me what you understand from this screen.',
      6: 'You\'ve come back to check your benefit later. Tell me what you understand about its current state.',
    };

    function App() {
      const [step, setStep] = useState(0);
      const [prevStep, setPrevStep] = useState(0);
      const [file, setFile] = useState(null);
      const [amount, setAmount] = useState(0);
      const [primary, setPrimary] = useState(null);
      const [secondary, setSecondary] = useState(null);
      const [taskMode, setTaskMode] = useState(false);
      const [calcModalView, setCalcModalView] = useState(null);
      const [editModal, setEditModal] = useState(null);
      const [tcsAccepted, setTcsAccepted] = useState(false);
      const [tcsErrorMobile, setTcsErrorMobile] = useState(false);
      const [benefitStatus, setBenefitStatus] = useState('pending'); // pending | active
      const [cancelDialog, setCancelDialog] = useState(false);
      const [device, setDevice] = useState('desktop');
      const [bottomDetailsOpen, setBottomDetailsOpen] = useState(false);
      const ocrAmount = 1450;

      const direction = step >= prevStep ? 'forward' : 'back';
      useEffect(() => { setPrevStep(step); }, [step]);
      useEffect(() => { setBottomDetailsOpen(false); }, [step]);
      useEffect(() => { setTcsErrorMobile(false); }, [step]);
      const animClass = direction === 'forward' ? 'anim-page-forward' : 'anim-page-back';

      useEffect(() => {
        if (file && amount === 0) setAmount(Math.min(ocrAmount, CEILING));
      }, [file]);

      useEffect(() => {
        if (primary) {
          const POTS = { bonus: 700, eoy: 1450 };
          const primaryRemaining = POTS[primary] || 0;
          const totalImpact = amount + Math.round(amount * EMPLOYER_COST);
          if (totalImpact <= primaryRemaining) setSecondary(null);
        }
      }, [primary, amount]);

      const reset = () => {
        setStep(0); setFile(null); setAmount(0); setPrimary(null); setSecondary(null);
        setTcsAccepted(false); setBenefitStatus('pending');
      };

      const jumpTo = (i) => {
        setStep(i);
        if (i >= 1 && !file) setFile({ name: 'attest_281_60_2024.pdf', size: '92.23 kb' });
        if (i >= 2 && amount === 0) setAmount(1050);
        if (i >= 3 && !primary) setPrimary('bonus');
        if (i >= 4 && primary === 'bonus' && amount > 700 && !secondary) setSecondary('eoy');
        if (i >= 4 && !tcsAccepted) setTcsAccepted(true);
      };

      const calcAmount = amount > 0 ? amount : 1050;

      // Compute mobile bottom-bar content per step — lightweight info + action pattern
      const renderMobileBottomBar = () => {
        if (step === 5) return null; // success has its own buttons in the body

        // Computed values used across multiple steps
        const totalImpact = amount > 0 ? amount + Math.round(amount * EMPLOYER_COST) : 0;
        const advantage = amount > 0 ? Math.round(amount * 0.16) : 0;
        const fmt = (n) => n.toLocaleString('en-BE');

        if (step === 0) {
          // Intro — ceiling-based value preview, no specific user amount yet
          return (
            <BottomBarSplit
              infoTop="Invest €1,050 · 30% tier"
              infoMain="~€548 net"
              infoSub="+€168 vs taking as cash"
              action={<Button variant="primary" className="w-full" onClick={() => setStep(1)}>Choose this benefit</Button>}
            />
          );
        }

        if (step === 1) {
          // Upload — amount unknown until file dropped; just helper + button
          return (
            <BottomBarSplit
              helper={file ? 'Ready to continue' : 'Upload your fiscal attest'}
              action={<Button variant="primary" className="w-full" onClick={() => setStep(2)} disabled={!file}>Continue</Button>}
            />
          );
        }

        if (step === 2) {
          // Verify — amount confirmed, but no budget chosen yet. Show only the advantage
          // as a motivation/value moment. Budget impact comes in next step where it's actionable.
          return (
            <BottomBarSplit
              infoTop="Net advantage estimated"
              infoMain={`+€${fmt(advantage)}`}
              infoSub="vs. taking this as cash"
              action={<Button variant="primary" className="w-full" onClick={() => setStep(3)} disabled={amount <= 0}>Continue</Button>}
            />
          );
        }

        if (step === 3) {
          const POTS = { bonus: 700, eoy: 1450 };
          const primaryRem = primary ? POTS[primary] : 0;
          const needsSecondary = primary && totalImpact > primaryRem;
          const ready = primary && (!needsSecondary || secondary);
          return (
            <>
              {bottomDetailsOpen && <BottomBarDetailsPanel amount={amount} />}
              <div className="flex items-center gap-6">
                <div className="flex-1 flex flex-col justify-center min-h-[48px] gap-0.5 min-w-0">
                  <div className="text-[11px] font-medium text-[var(--color-text-default)] tracking-[0.04em] uppercase">
                    Pay from budgets
                  </div>
                  <div className="ff-display font-semibold text-xl leading-7 tracking-tight text-[var(--color-text-prominent)]">
                    €{fmt(totalImpact)}
                  </div>
                  <DetailsToggle open={bottomDetailsOpen} onToggle={() => setBottomDetailsOpen(!bottomDetailsOpen)} />
                </div>
                <div className="flex-1">
                  <Button variant="primary" className="w-full" onClick={() => setStep(4)} disabled={!ready}>
                    Continue
                  </Button>
                </div>
              </div>
            </>
          );
        }

        if (step === 4) {
          return (
            <>
              {bottomDetailsOpen && <BottomBarDetailsPanel amount={amount} />}
              <div className="flex flex-col gap-3">
                <div className="flex items-center justify-end">
                  <DetailsToggle open={bottomDetailsOpen} onToggle={() => setBottomDetailsOpen(!bottomDetailsOpen)} />
                </div>
                <Checkbox
                  checked={tcsAccepted}
                  onChange={(v) => { setTcsAccepted(v); if (v) setTcsErrorMobile(false); }}
                  id="tcs-accept-mobile"
                >
                  I accept the{' '}
                  <button
                    type="button"
                    onClick={(e) => e.stopPropagation()}
                    className="underline link-underline hover:opacity-70"
                  >
                    terms & conditions
                  </button>.
                </Checkbox>
                {tcsErrorMobile && (
                  <div
                    className="flex items-start gap-1.5 text-xs anim-reveal"
                    style={{ color: 'var(--color-warning-text)' }}
                  >
                    <Icon d={ICONS.info} size={12} className="mt-0.5 shrink-0" />
                    <span>Please accept the terms and conditions to continue.</span>
                  </div>
                )}
                <Button
                  variant="primary"
                  className="w-full"
                  onClick={() => {
                    if (!tcsAccepted) { setTcsErrorMobile(true); return; }
                    setStep(5);
                  }}
                >
                  Submit choice
                </Button>
              </div>
            </>
          );
        }

        if (step === 6) {
          if (benefitStatus === 'active') return null; // active state has no action; header pill shows status
          return (
            <BottomBarSplit
              infoTop="Status"
              infoMain="Pending"
              infoSub="Submitted today"
              action={
                <Button variant="secondary" className="w-full" onClick={() => setCancelDialog(true)}>Cancel</Button>
              }
            />
          );
        }

        return null;
      };

      const appContent = (
        <>
          <TopNav active="Benefits" />
          {/* Mobile flow header (back button only) — bottom nav is intentionally hidden in this focused flow */}
          {step !== 5 && (
            <MobileFlowHeader
              onBack={
                step === 0
                  ? null
                  : step === 6
                    ? () => setStep(0)
                    : () => setStep(step - 1)
              }
            />
          )}
          {taskMode && <TaskBanner task={TASKS[step]} />}

          {/* Persistent stepper — Upload/Verify/Budget only. Review is a commit moment, not a form step. */}
          {step >= 1 && step <= 3 && (
            <div className="max-w-[1248px] mx-auto px-6 pt-4 stepper-shell">
              <Stepper current={step - 1} />
            </div>
          )}

          {/* Scroll area on mobile (flex:1, contains all screens). On desktop it's a passthrough. */}
          <div className="mobile-scroll-area">
            <div key={step} className={animClass}>
            {step === 0 && <IntroScreen onStart={() => setStep(1)} onOpenCalc={setCalcModalView} device={device} />}
            {step === 1 && (
              <UploadScreen
                file={file}
                onFile={setFile}
                onContinue={() => setStep(2)}
                onBack={() => setStep(0)}
                device={device}
                onOpenCalc={setCalcModalView}
              />
            )}
            {step === 2 && (
              <VerifyScreen
                amount={amount}
                ocrAmount={ocrAmount}
                onAmount={setAmount}
                onContinue={() => setStep(3)}
                onBack={() => setStep(1)}
                device={device}
                onOpenCalc={setCalcModalView}
              />
            )}
            {step === 3 && (
              <BudgetScreen
                amount={amount}
                primary={primary}
                secondary={secondary}
                onPrimary={setPrimary}
                onSecondary={setSecondary}
                onContinue={() => setStep(4)}
                onBack={() => setStep(2)}
                device={device}
                onOpenCalc={setCalcModalView}
              />
            )}
            {step === 4 && (
              <ReviewScreen
                amount={amount}
                file={file}
                primary={primary}
                secondary={secondary}
                tcsAccepted={tcsAccepted}
                onTcsToggle={setTcsAccepted}
                onSubmit={() => setStep(5)}
                onBack={() => setStep(3)}
                onEdit={setEditModal}
                onOpenCalc={setCalcModalView}
                device={device}
              />
            )}
            {step === 5 && (
              <SuccessScreen
                amount={amount}
                onViewClaim={() => { setBenefitStatus('pending'); setStep(6); }}
                onBackToBenefits={() => setStep(0)}
              />
            )}
            {step === 6 && (
              <BenefitDetailScreen
                amount={amount}
                file={file}
                primary={primary}
                secondary={secondary}
                status={benefitStatus}
                onClaimAgain={reset}
                onCancel={() => setCancelDialog(true)}
                onOpenCalc={setCalcModalView}
                onSetStatus={setBenefitStatus}
                device={device}
              />
            )}
            </div>
          </div>

          {/* App-level mobile bottom bar — pinned at bottom of phone frame via flex layout */}
          {renderMobileBottomBar() && (
            <MobileBottomBar>
              {renderMobileBottomBar()}
            </MobileBottomBar>
          )}

          {/* Edit modals (open from review) */}
          {editModal === 'amount' && (
            <EditAmountModal
              amount={amount}
              ocrAmount={ocrAmount}
              onSave={(v) => setAmount(v)}
              onClose={() => setEditModal(null)}
            />
          )}
          {editModal === 'document' && (
            <EditDocumentModal
              file={file}
              onSave={(f) => setFile(f)}
              onClose={() => setEditModal(null)}
            />
          )}
          {editModal === 'budget' && (
            <EditBudgetModal
              amount={amount}
              primary={primary}
              secondary={secondary}
              onSave={({ primary: p, secondary: s }) => { setPrimary(p); setSecondary(s); }}
              onClose={() => setEditModal(null)}
            />
          )}

          {/* Cancel claim confirmation */}
          {cancelDialog && (
            <CancelClaimDialog
              onConfirm={() => { setCancelDialog(false); reset(); }}
              onClose={() => setCancelDialog(false)}
            />
          )}

          {/* Calculation modal — overlays everything */}
          {calcModalView && (
            <CalculationModal
              view={calcModalView}
              amount={calcAmount}
              onClose={() => setCalcModalView(null)}
            />
          )}
        </>
      );

      return (
        <>
          {device === 'mobile' ? (
            <div className="min-h-screen flex justify-center pt-10 pb-32" style={{ background: '#f3f4f6' }}>
              <div className="device-bezel">
                <div className="device-screen mobile-mode">
                  {appContent}
                </div>
              </div>
            </div>
          ) : (
            <div className="min-h-screen bg-white pb-32">
              {appContent}
            </div>
          )}

          <ModeratorPanel
            step={step}
            onJump={jumpTo}
            onReset={reset}
            taskMode={taskMode}
            onToggleTask={() => setTaskMode(!taskMode)}
            device={device}
            onSetDevice={setDevice}
          />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
